
name: Calculadora CI with Maven

on:
  push_request:
    branches: ["main"]
  jobs:
    build:
      runs-on: ubuntu-latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar el JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Compilar y ejecutar tests de la Calculadora
        working-directory: ./calculadora-tdd
        run: mvn clean package
      - name: Guardar la Calculadora compilada
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app
          path: calculadora-tdd/target/*.jar
          if-no-files-found: error

